<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Wallet Clone</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wallet">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; overflow: hidden; }
    header { position: fixed; top: 0; width: 100%; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: #000; transition: all 0.3s ease; }
    .title { font-size: 32px; font-weight: 700; }
    .controls { display: flex; gap: 12px; }
    .control-btn { width: 44px; height: 44px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 24px; height: 24px; fill: #000; }
    
    .card-stack {
      margin-top: 80px;
      padding: 20px 0 120px 0;
      height: calc(100vh - 80px);
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .card-stack.pushed-down {
      transform: translateY(calc(100vh - 200px));
      overflow: hidden;
    }

    .section { display: flex; flex-direction: column; align-items: center; gap: 0; }

    .card {
      position: relative;
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5); /* Apple wallet casts shadow upwards onto previous card */
      margin-bottom: -72%; 
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), 
                  margin-bottom 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                  top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                  left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform, margin-bottom, top, left;
      transform: translateZ(0); 
      cursor: pointer;
    }
    
    /* Make the bottom stack cards even closer */
    .card-stack.pushed-down .card {
      margin-bottom: -90%;
    }

    .card img { width: 100%; display: block; pointer-events: none; }
    .card.active { position: fixed; z-index: 1000; }

    .header-hidden { opacity: 0; pointer-events: none; }
    .loyalty-separator { height: 100px; } /* Give some space between credit and loyalty */

    /* Face ID and Reader UI */
    .reader-ui { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 1001; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .reader-ui.visible { opacity: 1; }
    .face-id { display: flex; flex-direction: column; align-items: center; }
    .face-id svg { width: 60px; height: 60px; stroke: #fff; animation: scan 1.5s infinite alternate; }
    @keyframes scan { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.05); opacity: 1; } }
    
    .reader-prompt { display: flex; flex-direction: column; align-items: center; }
    .phone-icon { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
    .phone-icon .circle { position: absolute; border-radius: 50%; border: 2px solid #007aff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .phone-icon .c1 { width: 44px; height: 44px; border-width: 3px; }
    .phone-icon .c2 { width: 60px; height: 60px; border-width: 2px; opacity: 0.6; }
    .phone-icon .phone { width: 22px; height: 32px; background: #007aff; border-radius: 4px; border: 2px solid #000; z-index: 2; box-shadow: 0 0 0 2px #007aff; }

    .reader-prompt .text { font-size: 16px; color: #fff; opacity: 0.9; line-height: 1.4; }

    /* Add popup styles */
    .popup { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; padding: 1.5rem; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s ease; z-index: 2000; }
    .popup.visible { transform: translateY(0); }
    .popup button { width: 100%; padding: 1rem; background: #363638; color: white; border: none; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 16px; font-weight: 500;}
  </style>
</head>
<body>
  <header>
    <h1 class="title">Wallet</h1>
    <div class="controls">
      <div class="control-btn" id="addBtn">
        <svg viewBox="0 0 24 24"><path d="M19 11h-6V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/></svg>
      </div>
    </div>
  </header>

  <div class="card-stack" id="cardStack">
    <div class="section" id="creditSection"></div>
    <div class="loyalty-separator"></div>
    <div class="section" id="loyaltySection"></div>
  </div>

  <div class="reader-ui" id="readerUi">
    <div class="face-id" id="faceId">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3h-2a2 2 0 0 0 -2 2v2M17 3h2a2 2 0 0 1 2 2v2M3 17v2a2 2 0 0 0 2 2h2M21 17v2a2 2 0 0 1 -2 2h-2M9 10h.01M15 10h.01M9 15c1.5 1 4.5 1 6 0"/>
      </svg>
      <div style="margin-top:10px;font-size:15px">Face ID</div>
    </div>
    <div class="reader-prompt" id="readerPrompt" style="display:none;">
      <div class="phone-icon">
        <div class="circle c2"></div>
        <div class="circle c1"></div>
        <div class="phone"></div>
      </div>
      <div class="text">Поднесите устройство<br>к считывателю</div>
    </div>
  </div>

  <div class="popup">
    <button id="addCreditBtn">Add Credit/Debit Card</button>
    <button id="addLoyaltyBtn">Add Loyalty Card</button>
    <button id="cancelBtn">Cancel</button>
  </div>

  <script>
    const STORAGE_KEY = 'walletCards';
    let creditCards = [];
    let loyaltyCards = [];
    let readerTimeout;

    function saveCards() {
      const data = [
        ...creditCards.map(c => ({ image: c.image, isLoyalty: false })),
        ...loyaltyCards.map(c => ({ image: c.image, isLoyalty: true }))
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadSavedCards() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      saved.forEach(({ image, isLoyalty }) => {
        createCard(image, isLoyalty);
      });

      // Ensure default card is ALWAYS the main (last added to credit section = front of stack)
      const defaultCardImage = 'WhatsApp Image 2026-09-23 at 22.54.24.jpeg';
      let hasDefault = saved.some(c => c.image === defaultCardImage);
      
      // We can also remove it and re-add it so it's always at the front!
      // But for now, if it's not there, we add it.
      if (!hasDefault) {
        createCard(defaultCardImage, false);
      } else {
        // If it exists, let's move it to the front by removing its DOM element and re-appending it
        const allCards = document.querySelectorAll('.card');
        allCards.forEach(c => {
           if(c.dataset.image === defaultCardImage) {
              document.getElementById('creditSection').appendChild(c);
           }
        });
      }
    }

    function showReaderUI() {
      const ui = document.getElementById('readerUi');
      const faceId = document.getElementById('faceId');
      const prompt = document.getElementById('readerPrompt');
      
      ui.classList.add('visible');
      faceId.style.display = 'flex';
      prompt.style.display = 'none';

      clearTimeout(readerTimeout);
      readerTimeout = setTimeout(() => {
        faceId.style.display = 'none';
        prompt.style.display = 'flex';
      }, 1500);
    }

    function hideReaderUI() {
      clearTimeout(readerTimeout);
      document.getElementById('readerUi').classList.remove('visible');
    }

    function closeActiveCard() {
      const card = document.querySelector('.card.active');
      if (!card) return;

      hideReaderUI();

      const placeholder = card._placeholder;
      if (!placeholder) return;
      const rect = placeholder.getBoundingClientRect();

      card.style.top = rect.top + 'px';
      card.style.left = rect.left + 'px';
      card.style.transform = 'translateZ(0)'; // scale back

      document.getElementById('cardStack').classList.remove('pushed-down');
      document.querySelector('header').classList.remove('header-hidden');

      setTimeout(() => {
        if (card.classList.contains('active')) {
            placeholder.parentNode.insertBefore(card, placeholder);
            placeholder.remove();
            delete card._placeholder;
            card.classList.remove('active');
            card.style = ''; // remove inline styles
        }
      }, 400);
    }

    function createCard(imageSrc, isLoyalty) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.image = imageSrc;
      card.dataset.type = isLoyalty ? 'loyalty' : 'credit';
      
      const img = document.createElement('img');
      img.src = imageSrc;
      card.appendChild(img);

      const section = isLoyalty ? document.getElementById('loyaltySection') : document.getElementById('creditSection');
      section.appendChild(card);

      const data = { element: card, image: imageSrc };
      (isLoyalty ? loyaltyCards : creditCards).push(data);

      card.addEventListener('click', (e) => {
        // If this card is already active, close it
        if (card.classList.contains('active')) {
          closeActiveCard();
          return;
        }

        // If another card is active, and the stack is pushed down, clicks on inactive cards should close the active card
        if (document.getElementById('cardStack').classList.contains('pushed-down')) {
          closeActiveCard();
          e.stopPropagation();
          return;
        }

        // Make active
        const rect = card.getBoundingClientRect();
        
        // Create placeholder
        const placeholder = document.createElement('div');
        placeholder.className = 'card-placeholder';
        placeholder.style.height = card.offsetHeight + 'px';
        placeholder.style.marginBottom = '-72%';
        placeholder.style.visibility = 'hidden';
        card.parentNode.insertBefore(placeholder, card);
        card._placeholder = placeholder;

        // Move to body to avoid transform clipping
        document.body.appendChild(card);
        card.classList.add('active');
        
        // Initial fixed position
        card.style.top = rect.top + 'px';
        card.style.left = rect.left + 'px';
        card.style.margin = '0';
        card.style.width = rect.width + 'px';

        card.offsetHeight; // Force reflow

        // Animate
        card.style.top = '70px';
        card.style.left = '50%';
        card.style.transform = 'translateX(-50%) scale(1.02)';

        document.getElementById('cardStack').classList.add('pushed-down');
        document.querySelector('header').classList.add('header-hidden');

        if (!isLoyalty) {
          showReaderUI();
        }
      });

      saveCards();
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      document.querySelector('.popup').classList.add('visible');
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.querySelector('.popup').classList.remove('visible');
    });

    function setupFileInput(btnId, isLoyalty) {
      document.getElementById(btnId).addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
          const reader = new FileReader();
          reader.onload = () => createCard(reader.result, isLoyalty);
          reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
        document.querySelector('.popup').classList.remove('visible');
      });
    }

    setupFileInput('addCreditBtn', false);
    setupFileInput('addLoyaltyBtn', true);

    loadSavedCards();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>

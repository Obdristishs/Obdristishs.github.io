<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Wallet Clone</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wallet">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; overflow: hidden; }
    header { position: fixed; top: 0; width: 100%; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: transparent; transition: opacity 0.3s ease; }
    .header-hidden { opacity: 0; pointer-events: none; }
    
    .title { font-size: 32px; font-weight: 700; }
    .controls { display: flex; gap: 12px; }
    .control-btn { width: 44px; height: 44px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .control-btn svg { width: 24px; height: 24px; fill: #000; }
    
    .card-stack {
      position: relative;
      margin: 80px auto 0;
      width: 90%;
      max-width: 400px;
      height: calc(100vh - 80px);
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    
    .stack-spacer {
      width: 100%;
      pointer-events: none;
    }

    .card {
      position: absolute;
      top: 0; left: 0; width: 100%;
      border-radius: 16px;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5); /* Apple Wallet casts shadow upwards */
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
      cursor: pointer;
    }

    .card img { width: 100%; display: block; pointer-events: none; border-radius: 16px; }

    /* Face ID and Reader UI */
    .reader-ui { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 1001; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .reader-ui.visible { opacity: 1; }
    .face-id { display: flex; flex-direction: column; align-items: center; }
    .face-id svg { width: 60px; height: 60px; stroke: #fff; animation: scan 1.5s infinite alternate; }
    @keyframes scan { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.05); opacity: 1; } }
    
    .reader-prompt { display: flex; flex-direction: column; align-items: center; }
    .phone-icon { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
    .phone-icon .circle { position: absolute; border-radius: 50%; border: 2px solid #007aff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .phone-icon .c1 { width: 44px; height: 44px; border-width: 3px; }
    .phone-icon .c2 { width: 60px; height: 60px; border-width: 2px; opacity: 0.6; }
    .phone-icon .phone { width: 22px; height: 32px; background: #007aff; border-radius: 4px; border: 2px solid #000; z-index: 2; box-shadow: 0 0 0 2px #007aff; }

    .reader-prompt .text { font-size: 16px; color: #fff; opacity: 0.9; line-height: 1.4; }

    /* Add popup styles */
    .popup { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; padding: 1.5rem; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s ease; z-index: 2000; }
    .popup.visible { transform: translateY(0); }
    .popup button { width: 100%; padding: 1rem; background: #363638; color: white; border: none; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 16px; font-weight: 500;}
  </style>
</head>
<body>
  <header id="header">
    <h1 class="title">Wallet</h1>
    <div class="controls">
      <div class="control-btn" id="addBtn">
        <svg viewBox="0 0 24 24"><path d="M19 11h-6V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/></svg>
      </div>
    </div>
  </header>

  <div class="card-stack" id="cardStack">
    <div class="stack-spacer" id="stackSpacer"></div>
  </div>

  <div class="reader-ui" id="readerUi">
    <div class="face-id" id="faceId">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3h-2a2 2 0 0 0 -2 2v2M17 3h2a2 2 0 0 1 2 2v2M3 17v2a2 2 0 0 0 2 2h2M21 17v2a2 2 0 0 1 -2 2h-2M9 10h.01M15 10h.01M9 15c1.5 1 4.5 1 6 0"/>
      </svg>
      <div style="margin-top:10px;font-size:15px">Face ID</div>
    </div>
    <div class="reader-prompt" id="readerPrompt" style="display:none;">
      <div class="phone-icon">
        <div class="circle c2"></div>
        <div class="circle c1"></div>
        <div class="phone"></div>
      </div>
      <div class="text">Поднесите устройство<br>к считывателю</div>
    </div>
  </div>

  <div class="popup">
    <button id="addCreditBtn">Add Credit/Debit Card</button>
    <button id="addLoyaltyBtn">Add Loyalty Card</button>
    <button id="cancelBtn">Cancel</button>
  </div>

  <script>
    const STORAGE_KEY = 'walletCards';
    let allCards = [];
    let savedData = [];
    let readerTimeout;
    const cardStack = document.getElementById('cardStack');
    const stackSpacer = document.getElementById('stackSpacer');

    function saveCards() {
      // Rebuild savedData from allCards to maintain order
      savedData = allCards.map(c => ({ 
        image: c.dataset.image, 
        isLoyalty: c.dataset.type === 'loyalty' 
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
    }

    function loadSavedCards() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const defaultCardImage = 'WhatsApp Image 2026-09-23 at 22.54.24.jpeg';
      
      allCards = [];
      cardStack.innerHTML = '';
      cardStack.appendChild(stackSpacer);
      
      // Load all cards except the default one
      saved.forEach(({ image, isLoyalty }) => {
        if (image !== defaultCardImage) {
          createCard(image, isLoyalty, false);
        }
      });
      
      // ALWAYS create default card last so it becomes the main/front card
      createCard(defaultCardImage, false, false);
      
      saveCards();
    }

    function layoutCards() {
      const activeCard = allCards.find(c => c.classList.contains('active'));
      
      if (activeCard) {
        // Active mode
        cardStack.style.overflowY = 'hidden';
        const scrollTop = cardStack.scrollTop;
        const inactiveCards = allCards.filter(c => c !== activeCard);
        
        // Base coordinate for the stacked cards at the bottom
        const bottomBaseY = scrollTop + cardStack.clientHeight - 80;
        
        allCards.forEach(c => {
          if (c === activeCard) {
            c.style.zIndex = 1000;
            // Move up to view top
            c.style.transform = `translateY(${scrollTop - 10}px) scale(1.05)`;
          } else {
            const j = inactiveCards.indexOf(c);
            c.style.zIndex = j;
            c.style.transform = `translateY(${bottomBaseY + j * 12}px) scale(0.95)`;
          }
        });
      } else {
        // Normal mode
        cardStack.style.overflowY = 'auto';
        let currentY = 0;
        
        const credits = allCards.filter(c => c.dataset.type === 'credit');
        const loyalties = allCards.filter(c => c.dataset.type === 'loyalty');
        
        credits.forEach((c, i) => {
          c.style.zIndex = i;
          c.style.transform = `translateY(${currentY}px) scale(1)`;
          currentY += 55; // 55px peek
        });
        
        if (loyalties.length > 0) currentY += 50; // separator
        
        loyalties.forEach((c, i) => {
          c.style.zIndex = credits.length + i;
          c.style.transform = `translateY(${currentY}px) scale(1)`;
          currentY += 55;
        });
        
        // Update spacer height for scrolling
        const cardHeight = allCards[0] ? allCards[0].offsetHeight : 240;
        stackSpacer.style.height = (currentY + cardHeight + 40) + 'px';
      }
    }

    function showReaderUI() {
      const ui = document.getElementById('readerUi');
      const faceId = document.getElementById('faceId');
      const prompt = document.getElementById('readerPrompt');
      
      ui.classList.add('visible');
      faceId.style.display = 'flex';
      prompt.style.display = 'none';

      clearTimeout(readerTimeout);
      readerTimeout = setTimeout(() => {
        faceId.style.display = 'none';
        prompt.style.display = 'flex';
      }, 1500);
    }

    function hideReaderUI() {
      clearTimeout(readerTimeout);
      document.getElementById('readerUi').classList.remove('visible');
    }

    function createCard(imageSrc, isLoyalty, doSave = true) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.type = isLoyalty ? 'loyalty' : 'credit';
      card.dataset.image = imageSrc;
      
      const img = document.createElement('img');
      img.src = imageSrc;
      img.onload = () => layoutCards();
      card.appendChild(img);
      
      card.addEventListener('click', (e) => {
        if (card.classList.contains('active')) {
          card.classList.remove('active');
          hideReaderUI();
          document.getElementById('header').classList.remove('header-hidden');
        } else {
          const existing = allCards.find(c => c.classList.contains('active'));
          if (existing) {
            existing.classList.remove('active');
            hideReaderUI();
            document.getElementById('header').classList.remove('header-hidden');
            layoutCards();
            e.stopPropagation();
            return;
          }
          
          card.classList.add('active');
          document.getElementById('header').classList.add('header-hidden');
          if (card.dataset.type === 'credit') showReaderUI();
        }
        layoutCards();
      });
      
      cardStack.appendChild(card);
      allCards.push(card);
      
      if (doSave) saveCards();
      layoutCards();
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      document.querySelector('.popup').classList.add('visible');
    });
    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.querySelector('.popup').classList.remove('visible');
    });

    function setupFileInput(btnId, isLoyalty) {
      document.getElementById(btnId).addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
          const reader = new FileReader();
          reader.onload = () => createCard(reader.result, isLoyalty);
          reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
        document.querySelector('.popup').classList.remove('visible');
      });
    }

    setupFileInput('addCreditBtn', false);
    setupFileInput('addLoyaltyBtn', true);

    window.addEventListener('resize', layoutCards);

    loadSavedCards();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
